<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Suivi des charges et des répétitions, séance par séance.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<title>Carnet de charges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#E7EBEE; --paper:#FFFFFF; --ink:#16202B; --mute:#61707E;
  --line:#CCD5DC; --hair:#E7ECEF; --field:#F4F7F9;
  --green:#00784A; --red:#B32A30; --blue:#1A5E96; --amber:#8A5A0B;
  --wash-g:rgba(0,120,74,.10); --wash-b:rgba(26,94,150,.10);
  --wash-a:rgba(138,90,11,.12); --wash-r:rgba(179,42,48,.10);
  --on-ink:#FFFFFF;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --steel:#111820; --paper:#1A222B; --ink:#E6ECF1; --mute:#94A4B2;
    --line:#2C3A46; --hair:#232D37; --field:#131B23;
    --green:#4FB98A; --red:#E8737A; --blue:#7FB6E6; --amber:#D3A052;
    --wash-g:rgba(79,185,138,.14); --wash-b:rgba(127,182,230,.14);
    --wash-a:rgba(211,160,82,.15); --wash-r:rgba(232,115,122,.14);
    --on-ink:#111820;
  }
}
:root[data-theme="dark"]{
  --steel:#111820; --paper:#1A222B; --ink:#E6ECF1; --mute:#94A4B2;
  --line:#2C3A46; --hair:#232D37; --field:#131B23;
  --green:#4FB98A; --red:#E8737A; --blue:#7FB6E6; --amber:#D3A052;
  --wash-g:rgba(79,185,138,.14); --wash-b:rgba(127,182,230,.14);
  --wash-a:rgba(211,160,82,.15); --wash-r:rgba(232,115,122,.14);
  --on-ink:#111820;
}

*{box-sizing:border-box}
body{margin:0; background:var(--steel); color:var(--ink); font-family:var(--body);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
.app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}

/* ---------- barre du haut ---------- */
.haut{position:sticky; top:0; z-index:10; background:var(--steel); padding:14px 16px 10px}
.ligne1{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.seance{font-family:var(--cond); font-size:22px; font-weight:600; letter-spacing:.01em}
.seance select{font-family:var(--cond); font-size:22px; font-weight:600; color:var(--ink);
  background:transparent; border:none; padding:0 18px 0 0; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 6px center, right 1px center;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat}
.seance select:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.compteur{font-family:var(--cond); font-size:18px; font-weight:600; color:var(--mute);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.repris{margin:9px 0 0; font-size:12.5px; color:var(--green)}
.points{display:flex; gap:4px; margin-top:9px}
.pt{flex:1; height:4px; border-radius:2px; background:var(--line); border:none;
  padding:0; cursor:pointer}
.pt.fait{background:var(--green)} .pt.souci{background:var(--amber)}
.pt.ici{background:var(--ink)}
.pt:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

/* ---------- corps ---------- */
.corps{flex:1; padding:4px 16px 16px}
.fiche{background:var(--paper); border:1px solid var(--line); border-radius:4px;
  padding:18px 16px 16px}
.nom{font-family:var(--cond); font-size:27px; font-weight:600; line-height:1.1; margin:0}
.mus{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mute); font-weight:500; margin-top:6px}
.consigne{font-family:var(--cond); font-size:19px; font-weight:600; margin-top:10px;
  font-variant-numeric:tabular-nums}
.avant{font-size:13px; color:var(--mute); margin-top:2px; font-variant-numeric:tabular-nums}
.cle{font-size:14px; color:var(--ink); margin-top:9px; line-height:1.4}

/* ---------- guide deplie ---------- */
details.guide{margin-top:12px; font-size:13.5px; color:var(--mute);
  border-top:1px solid var(--hair); padding-top:8px}
details.guide summary{cursor:pointer; list-style:none; color:var(--ink); font-weight:500;
  padding:2px 0; display:inline-flex; align-items:baseline; gap:6px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::before{content:"+"; font-family:var(--cond); font-size:17px;
  line-height:1; color:var(--mute)}
details.guide[open] summary::before{content:"–"}
details.guide summary:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.guide .g-lab{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink); font-weight:600; margin:12px 0 5px}
.guide ol,.guide ul{margin:0; padding-left:18px}
.guide li{margin-bottom:6px}
.guide ul.pieges li::marker{color:var(--red)}
.guide p{margin:0 0 6px}

/* ---------- minuteur de repos ---------- */
.chrono{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px;
  background:var(--paper); border:1px solid var(--line); border-radius:4px;
  padding:10px 12px; margin-bottom:8px}
.chrono .c-lab{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute)}
.chrono .c-val{font-family:var(--cond); font-size:30px; font-weight:700; line-height:1;
  text-align:center; font-variant-numeric:tabular-nums}
.chrono .c-bt{border:1px solid var(--line); background:var(--field); color:var(--mute);
  border-radius:4px; padding:7px 12px; font-family:var(--cond); font-size:15px;
  font-weight:600; cursor:pointer; touch-action:manipulation}
.chrono .c-bt:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.chrono.fini{border-color:var(--green); background:var(--wash-g)}
.chrono.fini .c-val,.chrono.fini .c-lab{color:var(--green)}

/* ---------- molettes ---------- */
.champ{margin-top:18px}
.etiq{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute);
  font-weight:500; margin-bottom:7px; display:flex; justify-content:space-between; align-items:baseline}
.etiq em{font-style:normal; color:var(--ink); font-family:var(--cond); font-size:15px}
.molette{display:grid; grid-template-columns:64px 1fr 64px; gap:8px; align-items:stretch}
.molette button{border:1px solid var(--line); background:var(--field); color:var(--ink);
  border-radius:4px; font-family:var(--cond); font-size:30px; font-weight:600;
  line-height:1; cursor:pointer; touch-action:manipulation; user-select:none}
.molette button:active{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.molette button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.molette .val{display:flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); border-radius:4px; background:var(--paper);
  font-family:var(--cond); font-size:40px; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums; padding:10px 4px}
.molette .val small{font-family:var(--body); font-size:12px; font-weight:500;
  color:var(--mute); letter-spacing:.03em}
.molette.gd{grid-template-columns:52px 1fr 52px}
.molette.gd .val{font-size:32px}
.fin{display:grid; grid-template-columns:64px 1fr 64px; gap:8px; margin-top:7px;
  align-items:center}
.fin button{border:1px solid var(--line); background:var(--paper); color:var(--mute);
  border-radius:4px; padding:7px 0; font-family:var(--cond); font-size:16px;
  font-weight:600; cursor:pointer; touch-action:manipulation}
.fin button:active{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.fin button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.fin .detail{text-align:center; font-size:12.5px; color:var(--mute);
  font-variant-numeric:tabular-nums}
.fin .detail b{font-family:var(--cond); font-size:15px; color:var(--ink); font-weight:600}

/* ---------- séries ---------- */
.series{display:flex; flex-direction:column; gap:5px; margin-top:18px}
.serie{display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:10px;
  padding:9px 11px; border-radius:4px; background:var(--field); border:1px solid transparent;
  font-variant-numeric:tabular-nums; text-align:left; width:100%;
  font-family:var(--body); font-size:15px; color:var(--mute); cursor:default}
.serie .rang{font-family:var(--cond); font-size:15px; font-weight:600; letter-spacing:.03em}
.serie .res{font-family:var(--cond); font-size:22px; font-weight:600; color:var(--ink)}
.serie.faite{cursor:pointer}
.serie.faite .coche{color:var(--green); font-size:14px}
.serie.ici{background:var(--paper); border-color:var(--ink); color:var(--ink)}
.serie.ici .rang{color:var(--ink)}
.serie:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- bouton principal ---------- */
.valider{width:100%; margin-top:18px; padding:16px; border:none; border-radius:4px;
  background:var(--ink); color:var(--on-ink); font-family:var(--cond); font-size:21px;
  font-weight:600; letter-spacing:.01em; cursor:pointer; touch-action:manipulation}
.valider:active{opacity:.8}
.valider:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.valider.sec{background:var(--paper); color:var(--ink); border:1px solid var(--line)}

/* ---------- ressenti + verdict ---------- */
.senti{display:flex; gap:7px; margin-top:16px; align-items:center; flex-wrap:wrap}
.senti .lab{font-size:13px; color:var(--mute); width:100%; margin-bottom:-3px}
.chip{flex:1; font-size:15px; padding:10px 8px; border:1px solid var(--line);
  background:var(--field); color:var(--mute); border-radius:4px; cursor:pointer;
  font-family:var(--body); touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--on-ink)}
.chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.verdict{margin-top:16px; font-size:14px; padding:11px 12px; border-radius:4px}
.verdict b{font-weight:600}
.v-ok{background:var(--wash-g); color:var(--green)}
.v-monte{background:var(--wash-b); color:var(--blue)}
.v-lourd{background:var(--wash-a); color:var(--amber)}
.v-note{background:var(--hair); color:var(--mute)}
.drapeau{display:block; margin-top:6px; padding-top:6px; color:var(--red);
  border-top:1px solid currentColor}

/* ---------- navigation basse ---------- */
.bas{position:sticky; bottom:0; background:var(--steel); padding:10px 16px 16px}
.navs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.nav{padding:13px 10px; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:4px; font-family:var(--cond); font-size:18px; font-weight:600; cursor:pointer;
  touch-action:manipulation}
.nav:disabled{opacity:.35; cursor:default}
.nav:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- bilan ---------- */
.etat{font-family:var(--cond); font-size:34px; font-weight:700; line-height:1.05; margin:0 0 6px}
.etat.bien{color:var(--green)} .etat.moyen{color:var(--amber)} .etat.vide{color:var(--mute)}
.chiffres{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:12.5px;
  color:var(--mute); text-transform:uppercase; letter-spacing:.04em}
.chiffres b{display:block; font-family:var(--cond); font-size:28px; color:var(--ink);
  letter-spacing:0; text-transform:none}
.suite{margin-top:18px; padding-top:14px; border-top:1px solid var(--hair)}
.suite h3{font-family:var(--cond); font-size:19px; font-weight:600; margin:0 0 8px}
.suite ul{margin:0; padding-left:18px} .suite li{margin-bottom:7px; font-size:14.5px}
.msg{font-size:13.5px; color:var(--green); margin:12px 0 0; min-height:20px}
.msg.ko{color:var(--red)}

/* ---------- réglages ---------- */
details.reg{margin-top:18px}
details.reg summary{cursor:pointer; list-style:none; font-family:var(--cond); font-size:18px;
  font-weight:600; color:var(--mute); padding:8px 0}
details.reg summary::-webkit-details-marker{display:none}
details.reg summary::before{content:"+ "; color:var(--mute)}
details.reg[open] summary::before{content:"– "}
details.reg summary:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.reg .carte{background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:15px}
.reg .carte p{margin:0 0 11px; font-size:13.5px; color:var(--mute)}
.reg table{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.reg th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--mute); font-weight:500; padding:0 8px 6px 0; border-bottom:1px solid var(--line)}
.reg td{padding:6px 8px 6px 0; border-bottom:1px solid var(--hair)}
.reg tr:last-child td{border-bottom:none}
.reg td.n{font-family:var(--cond); font-weight:600; font-size:15px; text-align:right; padding-right:0}
.reg .duo{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.reg button{padding:11px 10px; border:1px solid var(--line); background:var(--field);
  color:var(--ink); border-radius:4px; font-family:var(--cond); font-size:16px;
  font-weight:600; cursor:pointer}
.reg button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
textarea{width:100%; min-height:80px; margin-top:10px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px; padding:9px; border:1px solid var(--line); border-radius:4px;
  background:var(--field); color:var(--ink); resize:vertical}
</style>

</head>
<body>
<div class="app">
  <div class="haut">
    <div class="ligne1">
      <div class="seance"><select id="selSeance" aria-label="Séance"></select></div>
      <div class="compteur" id="compteur"></div>
    </div>
    <div class="points" id="points"></div>
    <p class="repris" id="repris" hidden></p>
  </div>
  <div class="corps" id="corps"></div>
  <div class="bas">
    <div class="chrono" id="chrono" hidden>
      <span class="c-lab">Repos</span>
      <span class="c-val" id="chronoVal">—</span>
      <button class="c-bt" type="button" id="chronoStop">Passer</button>
    </div>
    <div class="navs">
      <button class="nav" id="prec" type="button">◀ Précédent</button>
      <button class="nav" id="suiv" type="button">Suivant ▶</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ PROGRAMME ============ */
var PROG = {
 A:{court:"Pecs", jour:1, exos:[
  {nom:"Développé pectoraux machine", mus:"Pectoraux · triceps · avant d'épaule", series:"4 × 8-12", charge:"ta plaque", repos:"90 s", cle:"Ton meilleur exercice : le seul où tu sens vraiment le pectoral.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Réglage habituel du siège, dos entier plaqué au dossier, pieds bien à plat au sol. Les poignées doivent arriver à hauteur de poitrine.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Sors la poitrine et serre les omoplates en arrière contre le dossier. Elles ne bougent plus de la série.</li> <li>Pousse vers l'avant en 1 seconde, sans à-coup.</li> <li>Arrête-toi juste avant que les coudes soient complètement tendus.</li> <li>Reviens en 2 secondes en freinant, jusqu'à sentir l'étirement sans forcer.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Au <b>milieu de la poitrine</b>, une tension large qui se resserre quand tu pousses, et les triceps chauds en fin de série. Si c'est l'avant de l'épaule qui brûle, tes omoplates ont lâché en cours de route.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Verrouiller les coudes en haut.</b> La tension quitte le pectoral et passe dans l'articulation. Garde toujours un léger pli.</li> <li><b>Laisser les épaules rouler vers l'avant.</b> C'est l'avant de l'épaule qui prend le travail. Omoplates serrées, poitrine sortie.</li> <li><b>Rebondir en bas.</b> Tu perds la partie la plus efficace du mouvement. Marque l'arrêt.</li> </ul>"},
  {nom:"Écarté poulie basse, un bras, bas vers haut", mus:"Pectoraux, faisceau haut · avant d'épaule", series:"3 × 12-15", charge:"pl. 1-2 · par bras", repos:"60 s", cle:"Exercice d'apprentissage, pas de construction. Deux séries légères pour chercher la sensation.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Poignée simple sur la poulie basse. Place-toi un pas de côté, poignée dans la main la plus éloignée de la machine.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coude légèrement fléchi et <b>fixe</b> : il ne bouge plus du tout de la série.</li> <li>Balaye de la hanche jusqu'à hauteur de l'œil opposé, en diagonale.</li> <li>1 seconde de contraction en haut.</li> <li>Reviens en freinant. <b>Gauche d'abord</b>, le droit s'aligne sur son nombre de répétitions.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>haut de la poitrine</b>, près de la clavicule, du côté du bras qui travaille. Si tu ne sens que l'épaule, c'est attendu pour l'instant — c'est précisément ce qu'on cherche à changer, sans forcer.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Plier et déplier le coude.</b> Tu fais alors un curl ou une extension, plus un écarté.</li> <li><b>Ne sentir que l'épaule.</b> Ça arrive, ne t'acharne pas : passe à la suite. Cet exercice n'a aucun enjeu pour l'instant.</li> <li><b>Charger.</b> Plaque 1 suffit. Ici on cherche la sensation, pas la performance.</li> </ul>"},
  {nom:"Développé machine, siège haut", mus:"Pectoraux, faisceau bas · triceps", series:"3 × 10-12", charge:"ta plaque −1", repos:"75 s", cle:"Même machine, siège monté de deux ou trois crans.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Monte le siège par rapport à ton réglage habituel. Les poignées arrivent alors plus bas sur ton torse.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Même installation que le développé classique : dos plaqué, omoplates serrées.</li> <li>Tu pousses vers l'avant <b>et légèrement vers le bas</b>.</li> <li>Une seconde de contraction, retour freiné en 2 secondes.</li> <li>Charge : une plaque de moins que ta série principale.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sous la poitrine, dans la <b>partie basse des pectoraux</b>, près du sternum, plus les triceps. Aucune tension ne doit se concentrer sur l'avant de l'épaule — c'est le repère qui dit si ton siège est bien réglé.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Sentir l'épaule.</b> C'est que le siège est encore trop bas. Monte-le d'un cran de plus.</li> <li><b>Reprendre le réglage du premier exercice.</b> Tout l'intérêt est dans l'angle différent — si le siège est au même endroit, tu refais le même exercice.</li> </ul>"},
  {nom:"Pompes mains sur le banc", mus:"Pectoraux · triceps · gainage", series:"3 × max", charge:"poids du corps", repos:"60 s", cle:"Version facile assumée : tu dois tenir 10 à 15 répétitions.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Mains sur le banc à largeur d'épaules, pieds au sol, corps en ligne droite de la tête aux talons.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Descends en 2 secondes jusqu'à frôler le banc de la poitrine.</li> <li>Coudes à environ 45° du corps, pas écartés en croix.</li> <li>Pousse pour remonter, sans creuser le bas du dos.</li> <li>Va jusqu'à l'échec technique : tu t'arrêtes quand la forme se dégrade, pas quand ça brûle.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Poitrine et triceps, plus une <b>contraction continue du ventre</b> pour tenir la ligne. Si le bas du dos tire, c'est que tes hanches sont tombées.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Les hanches qui tombent.</b> Serre les fessiers et le ventre, le corps reste une planche.</li> <li><b>Descendre à moitié.</b> Poitrine au banc ou l'exercice ne compte pas.</li> <li><b>Passer trop vite à la version dure.</b> 20 répétitions ici avant de mettre les mains au sol, et bien plus tard les pieds sur le banc.</li> </ul>"},
  {nom:"Élévations latérales poulie basse, un bras", mus:"Deltoïde latéral — le côté de l'épaule", series:"6 × 12-15", charge:"pl. 1 · par bras", repos:"45 s", cle:"Sentir l'épaule est le but. Cet exercice ne doit rien te faire à la poitrine.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Poignée simple sur la poulie basse, plaque 1. Debout à côté de la machine, le câble passe devant tes jambes, poignée dans la main opposée.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Pouce vers le haut, bras quasi tendu, coude à peine fléchi.</li> <li>Monte sur le côté <b>jusqu'à l'horizontale et pas plus haut</b>.</li> <li>1 seconde de pause en haut.</li> <li>3 secondes pour redescendre en freinant. <b>Gauche d'abord</b> : son nombre de répétitions fixe celui du droit.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>côté de l'épaule</b>, à mi-hauteur du bras, une brûlure très localisée. Rien dans la nuque ni le trapèze : si la sensation remonte vers le cou, tu montes trop haut ou tu hausses l'épaule.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Monter au-dessus de l'horizontale.</b> Au-delà, ce sont les trapèzes qui prennent le relais.</li> <li><b>Donner un coup de reins pour lancer le bras.</b> Si tu as besoin d'élan, c'est trop lourd.</li> <li><b>Hausser l'épaule.</b> L'épaule reste basse, seul le bras monte.</li> <li><b>Laisser le droit en faire plus.</b> C'est ce qui creuse l'écart au lieu de le refermer.</li> </ul>"},
  {nom:"Superset — Triceps poulie haute", mus:"Triceps", series:"4 × 12-15", charge:"pl. 3-5", repos:"0 s", cle:"Enchaîné sans repos avec l'exercice suivant.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Corde ou barre sur la poulie haute. Debout face à la machine, un pied légèrement devant l'autre, buste très légèrement penché.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coudes collés au corps, ils restent fixes pendant toute la série.</li> <li>Pousse vers le bas jusqu'à tendre les bras.</li> <li>Reviens en freinant jusqu'à ce que l'avant-bras soit à l'horizontale.</li> <li>Enchaîne immédiatement sur l'extension corde, sans repos.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>À l'<b>arrière du bras</b>, entre le coude et l'épaule. Rien dans l'épaule, rien dans l'avant-bras.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Les coudes qui partent vers l'avant ou s'écartent.</b> Ce sont les épaules et le dos qui aident. Coudes vissés aux côtes.</li> <li><b>Se pencher pour pousser avec le poids du corps.</b> Buste stable, seuls les avant-bras bougent.</li> </ul>"},
  {nom:"Superset — Extension triceps corde, poulie basse au-dessus de la tête", mus:"Triceps, longue portion", series:"4 × 12-15", charge:"pl. 3-5", repos:"60 s", cle:"Enchaîné sans repos après la poulie haute, puis 60 s après le couple.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Corde sur la poulie basse. Tourne le <b>dos à la machine</b>, corde ramenée derrière la nuque, un pied devant l'autre pour la stabilité.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coudes pointés vers l'avant et serrés, le plus près possible des oreilles.</li> <li>Tends les bras vers le haut et l'avant en 1 seconde.</li> <li>3 secondes pour revenir, jusqu'à sentir l'étirement derrière le bras.</li> <li>C'est cette position bras au-dessus de la tête qui travaille la longue portion, celle que la poulie haute ne touche pas.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Plus haut et plus profond qu'à la poulie haute : à l'<b>arrière du bras près de l'aisselle</b>, avec un étirement net quand les mains reviennent derrière la tête. C'est cette portion que l'autre exercice ne touche pas.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Les coudes qui s'écartent en V.</b> Le plus courant. Demande-toi de les garder parallèles.</li> <li><b>Cambrer le bas du dos.</b> Serre le ventre, un pied devant l'autre.</li> <li><b>Charger trop.</b> Cette position est mécaniquement défavorable, c'est normal d'y être plus faible qu'à la poulie haute.</li> </ul>"},
  {nom:"Rotation externe épaule, léger", mus:"Coiffe des rotateurs", series:"2 × 20", charge:"pl. 1", repos:"30 s", cle:"Première dose de la semaine pour la coiffe. Jamais lourd.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Poignée à hauteur de coude sur la poulie, le câble arrive de côté. Coude collé au flanc, plié à 90°.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coude vissé contre les côtes, il ne décolle jamais — glisse une serviette dessous si tu doutes.</li> <li>Fais pivoter l'avant-bras vers l'extérieur en 3 secondes, comme une porte qui s'ouvre.</li> <li>Reviens en 3 secondes, tout aussi lentement.</li> <li>Plaque 1. Ce muscle est petit, il n'a pas besoin de charge.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Profondément dans l'<b>arrière de l'épaule</b>, une sensation sourde et discrète. Si tu sens l'avant de l'épaule ou le biceps, le coude a décollé du corps.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Décoller le coude du corps.</b> L'exercice ne travaille plus la coiffe.</li> <li><b>Aller vite.</b> Tout le bénéfice est dans la lenteur et le contrôle.</li> <li><b>Charger pour progresser.</b> Ici on entretient une articulation, on ne construit pas un muscle.</li> </ul>"},
  {nom:"Planche + planche latérale", mus:"Gainage · obliques", series:"2 × 45 s", charge:"30 s / côté", repos:"30 s", cle:"Gainage. La qualité de la position prime sur la durée.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Avant-bras au sol, coudes sous les épaules, pieds à largeur de hanches.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Planche classique 45 secondes : corps parfaitement droit de la tête aux talons.</li> <li>Serre les fessiers et rentre légèrement le bassin, ventre contracté.</li> <li>Puis planche latérale 30 secondes de chaque côté, sur un avant-bras, hanches hautes.</li> <li>Respire normalement pendant tout le maintien.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Une <b>contraction continue de tout le ventre</b>, et des flancs sur la version latérale. Si tu sens le bas du dos, la position s'est affaissée : la série est finie.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Les fesses en l'air.</b> Position confortable et inutile. Descends le bassin en ligne.</li> <li><b>Le bas du dos qui creuse.</b> Signe que le ventre a lâché : arrête-toi là, la série est finie.</li> <li><b>Bloquer sa respiration.</b> Si tu ne peux pas parler, la position est trop dure.</li> </ul>"}
 ]},
 B:{court:"Dos", jour:4, exos:[
  {nom:"Tirage vertical, prise large", mus:"Grand dorsal · biceps", series:"4 × 8-12", charge:"pl. 4-6", repos:"90 s", cle:"Prise sans pouce : le pouce passe du même côté que les doigts.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Barre en prise large, mains plus écartées que les épaules. Assis, cuisses bloquées sous les cales, buste très légèrement incliné en arrière.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li><b>Prise crochet</b> : pouce par-dessus la barre, du même côté que les doigts. La main ne peut plus serrer.</li> <li>Sors la poitrine et abaisse les épaules avant de tirer.</li> <li>Tire en amenant <b>les coudes vers les hanches</b>, pas la barre vers le menton. Barre au haut de la poitrine.</li> <li>1 seconde d'omoplates serrées, puis 2 secondes pour remonter en freinant.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur les <b>côtés du dos, sous les aisselles</b>, une sensation large qui descend vers la taille. Si le biceps et l'avant-bras chauffent avant le dos, c'est que tu serres la barre — passe en prise sans pouce.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Le biceps et l'avant-bras gauches qui chauffent.</b> C'est le serrage de la main. La prise sans pouce est le correctif direct.</li> <li><b>Tirer la barre derrière la nuque.</b> Inutile et risqué pour l'épaule. Toujours devant.</li> <li><b>Se balancer d'avant en arrière.</b> Le buste bouge à peine, c'est le dos qui travaille.</li> </ul>"},
  {nom:"Rowing un bras, poulie basse, en fente", mus:"Milieu du dos · grand dorsal", series:"4 × 10-12", charge:"pl. 3-5 · par bras", repos:"75 s", cle:"C'est ici que ton dos gauche réapprend à tirer seul.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Poignée simple sur la poulie basse. Debout face à la machine, <b>un pied devant l'autre</b>, l'avant-bras libre en appui sur la cuisse avant.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Buste penché à environ 45°, dos plat, jamais arrondi.</li> <li>Tire la poignée vers la hanche, le coude longe les côtes vers l'arrière.</li> <li>1 seconde d'omoplate serrée en arrière et vers le bas.</li> <li>Retour freiné en 2 secondes, sans laisser l'épaule partir vers l'avant. <b>Gauche d'abord.</b></li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p><b>Entre l'omoplate et la colonne</b>, du côté qui tire, avec l'omoplate qui se serre vers l'intérieur en fin de mouvement. Le biceps participe un peu, mais il ne doit jamais lâcher avant le dos.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Tourner le buste pour aller chercher plus loin.</b> Les épaules restent parallèles au sol.</li> <li><b>Tirer avec la main.</b> Pense « je pousse mon coude vers l'arrière », la main ne fait que tenir.</li> <li><b>Arrondir le dos.</b> Poitrine sortie, regard vers le sol un mètre devant toi.</li> </ul>"},
  {nom:"Pull-over poulie haute, bras tendus", mus:"Grand dorsal — sans les biceps", series:"3 × 12-15", charge:"pl. 2-3", repos:"60 s", cle:"Coudes verrouillés du début à la fin. Si tu sens les triceps, ils se plient.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Corde ou barre sur la poulie haute. Debout à un pas de la machine, buste légèrement penché en avant, pieds ancrés.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Bras tendus devant toi, coudes <b>verrouillés</b> : ils deviennent un bloc rigide.</li> <li>Le seul mouvement autorisé vient de l'épaule.</li> <li>Ramène les mains vers les cuisses en 2 secondes, en sentant le côté du dos se contracter.</li> <li>Reviens en 2 secondes bras à l'horizontale.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur les <b>côtés du dos, sous les aisselles</b> — exactement la même zone que le tirage vertical, mais sans les bras. Aucun triceps : s'ils chauffent, tes coudes se plient.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Sentir les triceps.</b> Preuve que tes coudes se plient et se déplient : tu fais une extension triceps.</li> <li><b>Trop charger.</b> Le bras tendu est un très long levier, la charge utile est faible.</li> <li><b>Se redresser pendant l'effort.</b> L'inclinaison du buste ne bouge pas.</li> </ul>"},
  {nom:"Curl à la poulie basse, barre droite", mus:"Biceps", series:"5 × 10-12", charge:"pl. 4-6", repos:"60 s", cle:"Coudes collés au corps, ils ne partent pas vers l'avant.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Barre droite sur la poulie basse. Debout, pieds à largeur de hanches, bras le long du corps.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coudes vissés aux côtes, ils restent le point de pivot.</li> <li>Monte la barre en 2 secondes en fermant le coude.</li> <li>Contracte en haut sans monter les coudes.</li> <li>Redescends en 2 secondes jusqu'à bras presque tendus.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>devant du bras</b>, entre le coude et l'épaule. Si l'avant-bras ou l'épaule prennent le dessus, allège.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Les coudes qui avancent en fin de montée.</b> Le mouvement devient un tirage d'épaule et le biceps se repose.</li> <li><b>Se pencher en arrière pour lancer la barre.</b> Si tu as besoin d'élan, allège.</li> <li><b>Ne pas descendre complètement.</b> La partie basse est celle qui fait grossir le bras.</li> </ul>"},
  {nom:"Curl marteau haltères", mus:"Biceps · avant-bras", series:"4 × 12-15", charge:"2 × 10 kg", repos:"45 s", cle:"Paumes face à face, comme si tu tenais un marteau.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Un haltère dans chaque main, bras le long du corps, paumes tournées vers tes cuisses.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Garde la paume tournée vers l'intérieur pendant tout le mouvement — pas de rotation.</li> <li>Monte en 2 secondes, coudes fixes le long du corps.</li> <li>Redescends en 2 secondes.</li> <li>Tu peux alterner les bras ou monter les deux ensemble.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le devant du bras mais plus vers l'extérieur, et sur le <b>dessus de l'avant-bras</b>. Ici, sentir l'avant-bras est normal — c'est ce qui distingue ce curl du précédent.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Tourner le poignet en montant.</b> Ce serait un curl classique — ici la prise neutre est le point.</li> <li><b>Balancer les haltères.</b> Buste immobile, seuls les avant-bras bougent.</li> <li><b>Écarter les coudes.</b> Ils restent contre les flancs.</li> </ul>"},
  {nom:"Face pull à la corde", mus:"Arrière d'épaule · trapèze moyen · coiffe", series:"3 × 15-20", charge:"pl. 2-3", repos:"45 s", cle:"Jamais lourd. La qualité avant la charge.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Corde sur la poulie à hauteur de visage. Recule d'un ou deux pas pour mettre le câble en tension, un pied devant l'autre.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Prends la corde, paumes face à face, bras tendus devant toi.</li> <li>Tire la corde <b>vers ton visage</b> en écartant les mains vers l'extérieur en fin de course.</li> <li>En fin de mouvement, tes mains sont de chaque côté de ta tête, coudes hauts.</li> <li>1 seconde de contraction, retour freiné en 2 secondes.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>À l'<b>arrière des épaules et entre les omoplates</b>. Rien dans la nuque : si le trapèze du cou se contracte, la poulie est trop haute ou la charge trop lourde.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Tirer vers la poitrine.</b> Ce serait un rowing. La corde vient au niveau des yeux.</li> <li><b>Ne pas écarter les mains.</b> C'est justement l'écartement qui travaille l'arrière d'épaule.</li> <li><b>Charger.</b> Trop lourd, tu tires avec le dos et l'exercice ne sert plus à rien.</li> </ul>"},
  {nom:"Rotation externe épaule, coude au corps", mus:"Coiffe des rotateurs", series:"3 × 15", charge:"pl. 1-2", repos:"45 s", cle:"Deuxième dose de coiffe de la semaine. Une série de plus sur le bras d'arme.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Poignée à hauteur de coude, câble arrivant de côté. Coude collé au flanc, plié à 90°.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Coude vissé contre les côtes pendant toute la série.</li> <li>Ouvre l'avant-bras vers l'extérieur en 3 secondes.</li> <li>Reviens en 3 secondes, sans laisser le câble te ramener.</li> <li>Ajoute une série sur ton bras d'arme, le droit.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Profondément dans l'<b>arrière de l'épaule</b>, sourd et discret. Jamais de brûlure : ce muscle ne se travaille pas comme un biceps, et l'absence de sensation forte est normale.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Décoller le coude.</b> L'épaule compense et la coiffe ne travaille plus.</li> <li><b>Tourner le buste au lieu de l'épaule.</b> Le tronc reste face à l'avant.</li> <li><b>Charger.</b> Plaques 1-2, pas plus, quelle que soit ta progression ailleurs.</li> </ul>"},
  {nom:"Shrugs à la poulie basse", mus:"Trapèzes · prise", series:"3 × 15", charge:"pl. 6-8", repos:"60 s", cle:"Épaules vers les oreilles, 2 secondes de tenue en haut.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Barre droite sur la poulie basse, bras tendus le long du corps, debout bien droit.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Bras tendus et passifs : ils ne font que porter la barre.</li> <li>Monte les épaules droit vers les oreilles, sans rien plier.</li> <li><b>2 secondes de tenue en haut</b>, c'est là que tout se joue.</li> <li>Redescends lentement jusqu'à sentir l'étirement du trapèze.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>dessus des épaules</b> et à la base de la nuque, avec un étirement net en position basse. Les avant-bras fatiguent aussi, c'est attendu : la prise travaille autant que les trapèzes.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Plier les coudes.</b> Tu transformes l'exercice en tirage.</li> <li><b>Rouler les épaules en cercle.</b> Aucun bénéfice, et l'articulation n'aime pas. Monte et descends, en ligne droite.</li> <li><b>Ne pas marquer le temps en haut.</b> Sans la tenue, le trapèze ne travaille presque pas.</li> </ul>"},
  {nom:"Flexion et extension de poignet", mus:"Avant-bras", series:"2 × 15-20", charge:"10 kg", repos:"45 s", cle:"Placé en dernier volontairement : c'est celui-là que tu sautes si le temps manque.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Assis, avant-bras posé à plat sur la cuisse, poignet et main dans le vide au-delà du genou.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Paume vers le haut : laisse le poignet descendre, puis remonte l'haltère en fermant le poignet. 15 à 20 fois.</li> <li>Retourne l'avant-bras, paume vers le bas : même mouvement dans l'autre sens.</li> <li>L'avant-bras ne décolle jamais de la cuisse.</li> <li>Amplitude complète dans les deux sens, lentement.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur l'<b>avant-bras</b> : dessous quand la paume est vers le haut, dessus quand elle est vers le bas. Rien au coude.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Bouger le coude ou l'épaule.</b> Seul le poignet travaille.</li> <li><b>Aller trop vite.</b> Petits muscles, petites amplitudes : la lenteur est obligatoire.</li> </ul>"}
 ]},
 C:{court:"Jambes", jour:6, exos:[
  {nom:"Fente inversée, pas en arrière", mus:"Quadriceps · fessiers", series:"4 × 8-10", charge:"2 × 10 kg · par jambe", repos:"90 s", cle:"Remplace les fentes bulgares : le tibia reste vertical, le genou ne part pas devant.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Debout, un haltère dans chaque main bras le long du corps, pieds à largeur de hanches. Rien devant toi : c'est vers l'arrière que tu vas.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Fais un <b>grand pas en arrière</b> avec une jambe, et pose la pointe du pied. Le pied avant ne bouge pas de la série.</li> <li>Descends en <b>3 secondes</b> en gardant tout le <b>poids sur le pied avant</b>. Le genou arrière plie parce qu'il descend, pas parce que tu pousses dedans. Le tibia avant reste <b>vertical</b> : ton genou avant ne dépasse jamais tes orteils.</li> <li><b>Arrête-toi aux trois quarts</b>, cuisse avant encore au-dessus de la parallèle, genou arrière à dix centimètres du sol. Tu ne descends pas plus bas, même si tu le peux.</li> <li>1 seconde en bas, puis pousse dans le <b>talon avant</b> pour revenir debout en 1 seconde.</li> <li>Fais les 8 à 10 répétitions de la même jambe avant de changer.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur la <b>fesse et l'avant de la cuisse de la jambe avant</b>. Derrière, ça <b>tire</b> sur le devant de la cuisse et l'aine : c'est un étirement, il est normal et sans risque — la hanche s'ouvre, le droit fémoral s'allonge. Ce qui ne doit pas arriver, c'est que ce quadriceps arrière <b>force</b> : s'il travaille, ton poids a glissé en arrière et ta jambe avant ne fait plus rien.</p> <p><b>Le test :</b> en bas, essaie de décoller une seconde la pointe du pied arrière. Si tu y arrives sans perdre l'équilibre, tu es correctement chargé sur l'avant. Si tu tombes, recule le poids sur le talon avant.</p> <p>Au genou avant, <b>sentir quelque chose sans que ce soit douloureux est le but</b>, pas un défaut : c'est comme ça qu'une rotule réapprend à encaisser. Seule une vraie douleur commande de remonter de quelques centimètres — c'est l'amplitude qui fait mal, pas la charge.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Un pas trop court.</b> Le genou avant part vers l'avant et vient écraser la rotule. Recule davantage.</li> <li><b>Descendre trop bas.</b> Au-delà de la parallèle, la pression sous la rotule grimpe d'un coup. Les trois quarts sont une consigne, pas une approximation.</li> <li><b>Le genou avant qui rentre vers l'intérieur.</b> Il doit rester aligné sur la pointe du pied : c'est ce défaut qui entretient le syndrome.</li> <li><b>Pousser sur la jambe arrière pour remonter.</b> Le réflexe naturel, et il vide l'exercice de son intérêt. Tu remontes en poussant dans le talon avant, la jambe arrière ne fait que suivre.</li> <li><b>Charger avant que ce soit indolore.</b> Première séance à vide, mains sur les hanches. Les haltères viennent après.</li> </ul>"},
  {nom:"Extension de hanche, poulie basse et sangle de cheville", mus:"Fessiers · ischio-jambiers", series:"3 × 12-15", charge:"pl. 2-4 · par jambe", repos:"60 s", cle:"Le genou ne se plie jamais — c'est toute la différence avec le leg curl.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Sangle à une cheville, poulie basse. Debout <b>face à la machine</b>, tu tiens le montant à deux mains, buste légèrement penché en avant.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Jambe tendue, genou verrouillé.</li> <li>Recule la jambe le plus loin possible derrière toi.</li> <li><b>Serre la fesse</b> en fin de mouvement, 1 seconde.</li> <li>Retour freiné en 2 secondes. Gauche d'abord.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Franchement dans la <b>fesse</b>, au moment où tu serres en fin de mouvement, et un peu à l'arrière de la cuisse. Si tu sens le bas du dos, tu cambres au lieu d'ouvrir la hanche.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Plier le genou.</b> Tu fais alors un leg curl, et les fessiers ne travaillent plus.</li> <li><b>Cambrer le bas du dos pour aller plus loin.</b> L'amplitude vient de la hanche, pas de la colonne. Serre le ventre.</li> <li><b>Charger trop.</b> Si tu dois te tortiller, allège d'une plaque.</li> </ul>"},
  {nom:"Leg extension, poste leg developer", mus:"Quadriceps — l'avant de la cuisse", series:"4 × 12-15", charge:"pl. 3-4", repos:"75 s", cle:"Les deux jambes ensemble. Charge mesurée : 15 à 20 kg, pas 40.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Assis, dossier réglé pour que l'arrière des genoux touche le bord du siège. Tibias derrière le rouleau, rouleau juste au-dessus des chevilles.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Tiens les poignées latérales, dos plaqué au dossier.</li> <li>Tends les deux jambes en 2 secondes, mais <b>arrête-toi avant le verrouillage</b> : jambes presque droites, jamais complètement. C'est le dernier quart d'extension qui écrase le plus la rotule.</li> <li>1 seconde de contraction en haut, cuisses serrées.</li> <li><b>3 secondes pour redescendre</b> : c'est le quadriceps qui freine ta fente, c'est donc cette phase qui compte.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>dessus de la cuisse</b>, du genou à la hanche, avec une brûlure qui s'installe série après série. <b>Rien sous la rotule</b> : si ça pince en fin d'extension, réduis encore l'amplitude haute avant de toucher à la charge.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Décoller les fesses du siège.</b> Signe que c'est trop lourd. Descends d'une plaque.</li> <li><b>Lâcher la descente.</b> Tu perds les trois quarts du bénéfice. Compte les 3 secondes.</li> <li><b>Rouleau trop haut sur le tibia.</b> Il doit être juste au-dessus de la cheville, pas au milieu du mollet.</li> <li><b>Verrouiller les genoux en haut.</b> Le geste réflexe, et le pire pour toi. Garde toujours un léger angle.</li> </ul>"},
  {nom:"Leg curl debout, poulie basse et sangle de cheville", mus:"Ischio-jambiers — l'arrière de la cuisse", series:"4 × 12-15", charge:"pl. 3-5 · par jambe", repos:"60 s", cle:"Le talon vers la fesse, cuisse immobile. Seul exercice ischios du programme.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Sangle à une cheville, poulie basse. Debout <b>face à la machine</b>, tu tiens le montant, en appui sur l'autre jambe.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Cuisse verticale et immobile : seul le genou se plie.</li> <li>Ramène le talon vers la fesse en 2 secondes.</li> <li>1 seconde de contraction en haut.</li> <li>3 secondes pour redescendre en freinant, sans laisser le câble tirer.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>À l'<b>arrière de la cuisse</b>, entre le genou et la fesse. Si tu sens surtout le mollet, ton pied est trop tendu : laisse la cheville relâchée.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>La cuisse qui recule pendant la flexion.</b> Tu ajoutes de l'extension de hanche et l'ischio perd la tension.</li> <li><b>Cambrer le dos.</b> Serre le ventre et garde le bassin neutre.</li> <li><b>Confondre avec l'extension de hanche.</b> Ici le genou plie, là-bas il reste tendu.</li> </ul>"},
  {nom:"Mollets debout, une jambe à la fois", mus:"Mollets", series:"3 × 15", charge:"2 × 10 kg · par jambe", repos:"45 s", cle:"Une seule jambe, les deux haltères en main : tu doubles la charge par mollet.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Sur une marche ou le bord du banc, l'avant du pied dessus, le talon dans le vide. Les deux haltères dans les mains, une main peut se tenir au mur.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Descends le talon le plus bas possible, 1 seconde d'étirement en bas.</li> <li>Monte sur la pointe le plus haut possible en 2 secondes.</li> <li>1 seconde de contraction en haut.</li> <li>15 répétitions, puis change de jambe.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Dans le <b>mollet</b>, avec un étirement franc en bas et une contraction dure en haut. C'est un des rares muscles où la brûlure est le repère le plus fiable.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Amplitude réduite.</b> Le mollet ne répond qu'à l'amplitude complète : talon très bas, pointe très haute.</li> <li><b>Rebondir sur le tendon.</b> Marque l'arrêt en bas, sinon c'est l'élastique du tendon qui travaille, pas le muscle.</li> <li><b>Plier le genou.</b> La jambe reste tendue.</li> </ul>"},
  {nom:"Abduction de hanche, poulie basse et sangle de cheville", mus:"Moyen fessier — le côté de la hanche", series:"3 × 15", charge:"pl. 1-2 · par jambe", repos:"60 s", cle:"Le muscle qui empêche ton genou de rentrer vers l'intérieur. Le plus utile de la séance pour ta rotule.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Sangle à la cheville, câble à la poulie basse. Tu te places <b>de côté</b> par rapport à la poulie, la jambe sanglée étant celle qui est <b>loin</b> de la machine. Une main sur le montant pour l'équilibre.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Jambe tendue, pointe de pied vers l'avant — pas vers le plafond.</li> <li>Écarte la jambe sur le côté en 2 secondes, jusqu'à 30 ou 40 cm. Inutile d'aller plus haut.</li> <li>1 seconde en haut.</li> <li>3 secondes pour revenir, sans reposer le pied entre les répétitions.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur le <b>côté de la hanche</b>, juste sous la crête de l'os, une brûlure sourde qui arrive vite. Si tu sens le bas du dos ou l'aine, tu montes trop haut ou tu penches le buste.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Pencher le buste du côté opposé.</b> Reste vertical, sinon c'est le tronc qui fait le travail.</li> <li><b>Tourner la pointe du pied vers l'extérieur.</b> Ça déplace le travail sur le fléchisseur de hanche.</li> <li><b>Mettre trop lourd.</b> Ce muscle est petit. Une ou deux plaques suffisent largement.</li> </ul>"},
  {nom:"Crunch à la poulie haute, assis ou à genoux", mus:"Grands droits — la sangle abdominale", series:"3 × 12-15", charge:"pl. 4-6", repos:"45 s", cle:"Tu enroules le buste, menton vers le nombril. Ce n'est pas un mouvement de hanche.", guide:"<p class=\"g-lab\">Mise en place</p> <p>Corde sur la poulie haute. Assis sur le banc dos à la machine, ou à genoux au sol : les deux se valent, l'assis est plus stable.</p> <p class=\"g-lab\">Le mouvement</p> <ol> <li>Corde derrière la nuque, mains qui la tiennent sans tirer.</li> <li><b>Enroule le buste</b> vers les cuisses en arrondissant le dos, menton vers le nombril.</li> <li>1 seconde de contraction, ventre écrasé.</li> <li>Reviens en 2 secondes en déroulant, sans relâcher complètement.</li> </ol> <p class=\"g-lab\">Ce que tu dois sentir</p> <p>Sur toute la <b>sangle abdominale</b>, du sternum au nombril, qui se raccourcit. Si ce sont les hanches ou les cuisses qui travaillent, tu bascules au lieu d'enrouler.</p> <p class=\"g-lab\">Les pièges</p> <ul class=\"pieges\"> <li><b>Basculer depuis les hanches, dos droit.</b> Les abdos ne travaillent pas. C'est la colonne qui doit s'enrouler.</li> <li><b>Tirer avec les bras.</b> Les mains ne font que tenir la corde en place.</li> <li><b>Se relever complètement entre les répétitions.</b> Garde la tension.</li> </ul>"}

function lire(s){
  var m = /^(\d+)\s*×\s*(.+)$/.exec(s);
  var n = m ? parseInt(m[1],10) : 3, r = m ? m[2].trim() : "";
  if (/\ds$/.test(r.replace(/\s/g,""))) return {n:n, type:"temps", cible:parseInt(r,10)||45};
  if (/max/i.test(r))                   return {n:n, type:"max"};
  var f = /^(\d+)\s*-\s*(\d+)$/.exec(r);
  if (f)                                return {n:n, type:"fourchette", bas:+f[1], haut:+f[2]};
  var c = /^(\d+)$/.exec(r);
  if (c)                                return {n:n, type:"cible", cible:+c[1]};
  return {n:n, type:"libre"};
}
function uni(c){ return /par bras|par jambe|par côté/i.test(c); }
var KG_PLAQUE = 5;
function colonne(c){ return /pl\.|plaque/i.test(c); }
function unite(c){
  if (/poids du corps/i.test(c)) return null;
  if (/^30 s/.test(c))           return null;
  return "kg";
}
function pasCharge(c){ return colonne(c) ? KG_PLAQUE : 1; }
function miniCharge(c){ return colonne(c) ? KG_PLAQUE : 0; }
/* 2 poids de 1 kg + 2 de 2 kg : tout appoint de 0 a 6 kg est composable */
var APPOINT_MAX = 6;
function montage(kg){
  var pl = Math.floor(kg / KG_PLAQUE), reste = kg - pl * KG_PLAQUE;
  if (reste > APPOINT_MAX){ pl += 1; reste -= KG_PLAQUE; }
  var t = "<b>" + pl + "</b> plaque" + (pl > 1 ? "s" : "");
  if (reste > 0) t += " + <b>" + reste + "</b> kg";
  return t;
}
function consigneKg(c){
  var m = /pl\.\s*(\d+)(?:\s*-\s*(\d+))?/i.exec(c);
  if (m) return m[2] ? (m[1]*KG_PLAQUE) + "–" + (m[2]*KG_PLAQUE) + " kg"
                     : (m[1]*KG_PLAQUE) + " kg";
  var k = /(\d+)\s*kg/i.exec(c);
  return k ? k[1] + " kg" : null;
}
function chargeDepart(c){
  var m = /pl\.\s*(\d+)/i.exec(c); if (m) return m[1] * KG_PLAQUE;
  var k = /(\d+)\s*kg/i.exec(c);   if (k) return +k[1];
  return 20;
}
function repsDepart(p){
  if (p.type === "fourchette") return p.bas;
  if (p.type === "cible" || p.type === "temps") return p.cible;
  return 10;
}

/* ============ VERDICT ============ */
function verdict(p, lignes, u, senti){
  var f = lignes.filter(function(l){ return l.g !== null; });
  if (!f.length) return null;
  var v = {niveau:"note", txt:"Séries enregistrées.", flags:[], action:null};
  var reps = f.map(function(l){ return l.g; });

  if (p.type === "fourchette"){
    if (reps.some(function(r){ return r < p.bas; })){
      v.niveau="lourd"; v.action="Descends d'une plaque";
      v.txt="Tu es passé sous " + p.bas + " répétitions.";
    } else if (f.length >= p.n && reps.every(function(r){ return r >= p.haut; })){
      v.niveau="monte"; v.action="Monte d'une plaque";
      v.txt="Toutes tes séries au plafond de " + p.haut + ".";
    } else {
      v.niveau="ok"; v.txt="Dans la fourchette " + p.bas + "-" + p.haut + ". Charge juste.";
    }
  } else if (p.type === "cible" || p.type === "temps"){
    var mot = p.type === "temps" ? " secondes" : " répétitions";
    if (reps.some(function(r){ return r < p.cible; })){
      v.niveau="lourd"; v.action="Allège";
      v.txt="Les " + p.cible + mot + " ne sont pas là sur toutes les séries.";
    } else { v.niveau="ok"; v.txt="Les " + p.cible + mot + " sont là partout."; }
  } else if (p.type === "max"){
    var best = Math.max.apply(null, reps);
    v.niveau="ok"; v.txt="Meilleure série : " + best + " répétitions.";
    if (best >= 20) v.action="Passe à la variante plus dure";
  }

  if (u && f.some(function(l){ return l.d !== null && l.d > l.g; }))
    v.flags.push("Le côté droit a dépassé le gauche. Le gauche donne le ton : plafonne le droit sur lui.");
  if (senti === "non"){
    v.flags.push("Pas senti au bon endroit.");
    if (v.niveau === "monte"){
      v.niveau="note"; v.action=null;
      v.txt="Les répétitions sont là, mais pas la sensation. Ne monte pas la charge tant que tu ne sens pas le muscle.";
    }
  }
  return v;
}

/* ============ STOCKAGE ============ */
var CLE = "muscu.carnet.v1", DB;
try { DB = JSON.parse(localStorage.getItem(CLE)) || {seances:[]}; } catch(e){ DB = {seances:[]}; }
if (!DB.seances) DB.seances = [];
if (DB.unite !== "kg"){
  DB.seances.forEach(function(se){
    var prog = PROG[se.seance]; if (!prog) return;
    Object.keys(se.exos).forEach(function(nom){
      var ex = null;
      prog.exos.forEach(function(e){ if (e.nom === nom) ex = e; });
      if (!ex || !colonne(ex.charge)) return;
      se.exos[nom].lignes.forEach(function(l){
        if (l.charge !== null && l.charge !== undefined) l.charge *= KG_PLAQUE;
      });
    });
  });
  DB.unite = "kg";
  try { localStorage.setItem(CLE, JSON.stringify(DB)); } catch(e){}
}
function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(DB)); return true; }catch(e){ return false; } }
function derniere(nom){
  var alias = [nom];
  for (var k in RENOMMAGES) if (RENOMMAGES[k] === nom) alias.push(k);
  for (var i = DB.seances.length-1; i >= 0; i--){
    for (var a = 0; a < alias.length; a++){
      var e = DB.seances[i].exos[alias[a]];
      if (e && e.lignes && e.lignes.length) return {date:DB.seances[i].date, e:e};
    }
  }
  return null;
}
function isoAuj(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateFr(iso){
  return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
}

/* ============ MINUTEUR DE REPOS ============ */
var repos = null, tic = null;

function secondes(t){
  var m = /(\d+)\s*s/.exec(t || "");
  return m ? parseInt(m[1], 10) : 0;
}
function lancerTic(){ if (!tic) tic = setInterval(peindreChrono, 250); }
function demarrerRepos(sec){
  if (!(sec > 0)) return;
  repos = {fin: Date.now() + sec * 1000, total: sec};
  lancerTic(); peindreChrono();
}
function arreterRepos(){
  repos = null;
  if (tic){ clearInterval(tic); tic = null; }
  peindreChrono(); sauverBrouillon();
}
function peindreChrono(){
  var b = document.getElementById("chrono"), v = document.getElementById("chronoVal");
  if (!b) return;
  if (!repos){ b.hidden = true; b.classList.remove("fini"); return; }
  b.hidden = false;
  var r = Math.round((repos.fin - Date.now()) / 1000);
  if (r <= 0){
    if (!b.classList.contains("fini")){
      b.classList.add("fini");
      if (navigator.vibrate){ try { navigator.vibrate([120, 80, 120]); } catch(e){} }
    }
    v.textContent = "Terminé";
  } else {
    b.classList.remove("fini");
    v.textContent = r >= 60
      ? Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0")
      : r + " s";
  }
}

/* ============ ÉTAT ============ */
var seance, pos = 0, saisie = {};

function preparer(k){
  if (!saisie[k]) saisie[k] = {};
  PROG[k].exos.forEach(function(ex){
    var p = lire(ex.series);
    var st = saisie[k][ex.nom];
    if (!st){
      var d = derniere(ex.nom), lignes = [];
      for (var i = 0; i < p.n; i++) lignes.push({charge:null, g:null, d:null});
      var ch = d && d.e.lignes[0] && d.e.lignes[0].charge !== null
             ? d.e.lignes[0].charge : chargeDepart(ex.charge);
      saisie[k][ex.nom] = {lignes:lignes, senti:null, charge:ch, cour:0};
      return;
    }
    /* le programme a pu changer depuis : on complete sans rien perdre */
    while (st.lignes.length < p.n) st.lignes.push({charge:null, g:null, d:null});
    if (st.cour > p.n) st.cour = p.n;
  });
}
function initSeance(k){ seance = k; pos = 0; preparer(k); }

/* ---- seance en cours : survit a une sortie de l'app ---- */
var CLE_BROUILLON = "muscu.carnet.encours.v1", repris = false;
function sauverBrouillon(){
  try {
    localStorage.setItem(CLE_BROUILLON, JSON.stringify(
      {ts:Date.now(), seance:seance, pos:pos, saisie:saisie, repos:repos}));
  } catch(e){}
}
function oublierBrouillon(){
  try { localStorage.removeItem(CLE_BROUILLON); } catch(e){}
}
function lireBrouillon(){
  try {
    var b = JSON.parse(localStorage.getItem(CLE_BROUILLON));
    if (!b || !b.saisie || !b.ts) return null;
    if (Date.now() - b.ts > 12 * 3600 * 1000) return null;  /* trop vieux */
    return b;
  } catch(e){ return null; }
}
function etat(ex){ return saisie[seance][ex.nom]; }

/* ============ MOLETTE ============ */
function molette(opts){
  var boite = document.createElement("div");
  var wrap = document.createElement("div");
  wrap.className = "molette" + (opts.petit ? " gd" : "");
  var moins = document.createElement("button"); moins.type="button";
  moins.textContent="−"; moins.setAttribute("aria-label","Diminuer " + opts.nom);
  var val = document.createElement("div"); val.className="val";
  var plus = document.createElement("button"); plus.type="button";
  plus.textContent="+"; plus.setAttribute("aria-label","Augmenter " + opts.nom);
  var v = opts.valeur;
  var detail = null;
  function peindre(){
    val.innerHTML = "";
    val.appendChild(document.createTextNode(String(v)));
    if (opts.unite){ var s=document.createElement("small"); s.textContent=opts.unite; val.appendChild(s); }
    val.setAttribute("aria-live","polite");
    val.setAttribute("aria-label", opts.nom + " " + v);
    if (detail) detail.innerHTML = opts.detail(v);
  }
  function bouge(d, pas){
    v = Math.max(opts.min, Math.min(opts.max, +(v + d * (pas || opts.pas)).toFixed(2)));
    peindre(); opts.change(v);
  }
  [[moins,-1],[plus,1]].forEach(function(paire){
    var b = paire[0], sens = paire[1], t, iv;
    function stop(){ clearTimeout(t); clearInterval(iv); }
    b.addEventListener("click", function(e){ e.preventDefault(); bouge(sens); });
    b.addEventListener("pointerdown", function(){
      t = setTimeout(function(){ iv = setInterval(function(){ bouge(sens); }, 90); }, 420);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ b.addEventListener(ev, stop); });
  });
  wrap.appendChild(moins); wrap.appendChild(val); wrap.appendChild(plus);
  boite.appendChild(wrap);

  if (opts.fin){
    var bas = document.createElement("div"); bas.className = "fin";
    var m1 = document.createElement("button"); m1.type = "button";
    m1.textContent = "− " + opts.fin; m1.setAttribute("aria-label","Retirer " + opts.fin + " kg");
    detail = document.createElement("div"); detail.className = "detail";
    var p1 = document.createElement("button"); p1.type = "button";
    p1.textContent = "+ " + opts.fin; p1.setAttribute("aria-label","Ajouter " + opts.fin + " kg");
    m1.addEventListener("click", function(e){ e.preventDefault(); bouge(-1, opts.fin); });
    p1.addEventListener("click", function(e){ e.preventDefault(); bouge(1, opts.fin); });
    bas.appendChild(m1); bas.appendChild(detail); bas.appendChild(p1);
    boite.appendChild(bas);
  }
  peindre();
  return boite;
}

/* ============ RENDU ============ */
var corps = document.getElementById("corps");

function entete(){
  var sel = document.getElementById("selSeance");
  if (!sel.options.length){
    ["A","B","C"].forEach(function(k){
      var o = document.createElement("option");
      o.value = k; o.textContent = "Séance " + k + " · " + PROG[k].court;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function(){ initSeance(sel.value); sauverBrouillon(); dessiner(); });
  }
  sel.value = seance;
  var n = PROG[seance].exos.length;
  document.getElementById("compteur").textContent =
    pos >= n ? "Bilan" : (pos + 1) + " / " + n;

  var pts = document.getElementById("points");
  pts.innerHTML = "";
  PROG[seance].exos.forEach(function(ex, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "pt";
    b.setAttribute("aria-label", "Aller à " + ex.nom);
    var st = etat(ex), v = verdict(lire(ex.series), st.lignes, uni(ex.charge), st.senti);
    if (v) b.classList.add(v.niveau === "lourd" || v.flags.length ? "souci" : "fait");
    if (i === pos) b.classList.add("ici");
    b.addEventListener("click", function(){ pos = i; dessiner(); });
    pts.appendChild(b);
  });
}

function dessiner(){
  entete();
  var av = document.getElementById("repris");
  av.hidden = !repris;
  if (repris){ av.textContent = "Séance en cours restaurée."; repris = false; }
  corps.innerHTML = "";
  var n = PROG[seance].exos.length;
  document.getElementById("prec").disabled = pos === 0;
  document.getElementById("suiv").textContent = pos >= n - 1 ? "Bilan ▶" : "Suivant ▶";
  document.getElementById("suiv").disabled = pos >= n;
  if (pos >= n){ bilan(); return; }

  var ex = PROG[seance].exos[pos], p = lire(ex.series), u = uni(ex.charge),
      un = unite(ex.charge), st = etat(ex);

  var f = document.createElement("div"); f.className = "fiche";

  var h = document.createElement("h1"); h.className = "nom";
  h.appendChild(document.createTextNode(ex.nom));
  var m = document.createElement("span"); m.className = "mus"; m.textContent = ex.mus;
  h.appendChild(m); f.appendChild(h);

  var c = document.createElement("div"); c.className = "consigne";
  c.textContent = ex.series + "  ·  " + ex.charge +
                  (ex.repos ? "  ·  repos " + ex.repos : "");
  f.appendChild(c);

  if (ex.cle){
    var cl = document.createElement("p"); cl.className = "cle";
    cl.textContent = ex.cle; f.appendChild(cl);
  }

  var d = derniere(ex.nom);
  if (d){
    var a = document.createElement("div"); a.className = "avant";
    var r = d.e.lignes.map(function(l){
      return l.d !== null && l.d !== l.g ? l.g + "/" + l.d : l.g; }).join(" · ");
    var ch = d.e.lignes[0] && d.e.lignes[0].charge !== null ? d.e.lignes[0].charge : null;
    a.textContent = "Le " + dateFr(d.date) + (ch !== null ? " — " + ch + " kg" : "") + " — " + r;
    f.appendChild(a);
  }

  if (ex.guide){
    var gd = document.createElement("details"); gd.className = "guide";
    gd.innerHTML = "<summary>Comment le faire</summary>" + ex.guide;
    f.appendChild(gd);
  }

  if (un){
    var bc = document.createElement("div"); bc.className = "champ";
    var ck = consigneKg(ex.charge);
    var ec = document.createElement("div"); ec.className = "etiq";
    ec.innerHTML = "<span>Charge</span>" + (ck ? "<em>consigne " + ck + "</em>" : "");
    bc.appendChild(ec);
    var mini = miniCharge(ex.charge), pas = pasCharge(ex.charge),
        colo = colonne(ex.charge);
    if (st.charge < mini) st.charge = mini;
    st.charge = Math.round(st.charge);
    bc.appendChild(molette({nom:"charge", valeur:st.charge, min:mini, max:200, pas:pas,
      unite:"kg", fin: colo ? 1 : 0, detail: colo ? montage : null,
      change:function(v){ st.charge = v; sauverBrouillon(); }}));
    f.appendChild(bc);
  }

  var ls = document.createElement("div"); ls.className = "series";
  for (var i = 0; i < p.n; i++) ls.appendChild(ligneSerie(ex, p, u, st, i));
  f.appendChild(ls);

  if (st.cour < p.n){
    var lab = p.type === "temps" ? "secondes" : "répétitions";
    var bg = document.createElement("div"); bg.className = "champ";
    var eg = document.createElement("div"); eg.className = "etiq";
    eg.innerHTML = "<span>" + (u ? "Côté gauche" : lab) + "</span><em>série " + (st.cour + 1) + "</em>";
    bg.appendChild(eg);
    var lg = st.lignes[st.cour];
    if (lg.g === null) lg.g = suggestion(ex, p, st, st.cour, "g");
    bg.appendChild(molette({nom:"répétitions", valeur:lg.g, min:0, max:200, pas:1,
      unite:null, petit:u, change:function(v){ lg.g = v; sauverBrouillon(); }}));
    f.appendChild(bg);

    if (u){
      var bd = document.createElement("div"); bd.className = "champ";
      var ed = document.createElement("div"); ed.className = "etiq";
      ed.innerHTML = "<span>Côté droit</span><em>plafonné par le gauche</em>";
      bd.appendChild(ed);
      if (lg.d === null) lg.d = lg.g;
      bd.appendChild(molette({nom:"répétitions droite", valeur:lg.d, min:0, max:200, pas:1,
        unite:null, petit:true, change:function(v){ lg.d = v; sauverBrouillon(); }}));
      f.appendChild(bd);
    }

    var bv = document.createElement("button");
    bv.className = "valider"; bv.type = "button";
    bv.textContent = "Valider la série " + (st.cour + 1);
    bv.addEventListener("click", function(){
      st.lignes[st.cour].charge = un ? st.charge : null;
      st.cour++;
      demarrerRepos(secondes(ex.repos));
      sauverBrouillon();
      dessiner();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    f.appendChild(bv);
  }

  if (st.cour > 0 && p.type !== "temps"){
    var se = document.createElement("div"); se.className = "senti";
    var sl = document.createElement("span"); sl.className = "lab";
    sl.textContent = "Senti dans " + ex.mus.split(" ·")[0].toLowerCase() + " ?";
    se.appendChild(sl);
    [["oui","Oui, bien senti"],["non","Non, ailleurs"]].forEach(function(o){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = o[1];
      b.setAttribute("aria-pressed", st.senti === o[0] ? "true" : "false");
      b.addEventListener("click", function(){
        st.senti = st.senti === o[0] ? null : o[0]; sauverBrouillon(); dessiner();
      });
      se.appendChild(b);
    });
    f.appendChild(se);
  }

  var v = verdict(p, st.lignes, u, st.senti);
  if (v){
    var vb = document.createElement("div");
    vb.className = "verdict v-" + v.niveau; vb.setAttribute("role","status");
    vb.innerHTML = (v.action ? "<b>" + v.action + ".</b> " : "") + v.txt +
      v.flags.map(function(x){ return '<span class="drapeau">' + x + "</span>"; }).join("");
    f.appendChild(vb);
  }

  corps.appendChild(f);
}

function suggestion(ex, p, st, i, cote){
  if (i > 0 && st.lignes[i-1][cote] !== null) return st.lignes[i-1][cote];
  var d = derniere(ex.nom);
  if (d && d.e.lignes[i] && d.e.lignes[i][cote] !== null && d.e.lignes[i][cote] !== undefined)
    return d.e.lignes[i][cote];
  if (d && d.e.lignes[0] && d.e.lignes[0].g !== null) return d.e.lignes[0].g;
  return repsDepart(p);
}

function ligneSerie(ex, p, u, st, i){
  var l = st.lignes[i], faite = i < st.cour, ici = i === st.cour;
  var el = document.createElement(faite ? "button" : "div");
  if (faite) el.type = "button";
  el.className = "serie" + (faite ? " faite" : "") + (ici ? " ici" : "");
  var rang = document.createElement("span"); rang.className = "rang";
  rang.textContent = "Série " + (i + 1); el.appendChild(rang);
  var res = document.createElement("span"); res.className = "res";
  res.textContent = faite ? (u && l.d !== null && l.d !== l.g ? l.g + " / " + l.d : String(l.g))
                          : (ici ? "en cours" : "—");
  if (!faite){ res.style.fontFamily = "var(--body)"; res.style.fontSize = "14px";
               res.style.color = "var(--mute)"; }
  el.appendChild(res);
  var fin = document.createElement("span");
  fin.className = "coche"; fin.textContent = faite ? "modifier" : "";
  el.appendChild(fin);
  if (faite) el.addEventListener("click", function(){ st.cour = i; sauverBrouillon(); dessiner(); });
  return el;
}

/* ============ BILAN ============ */
function bilan(){
  var exos = PROG[seance].exos, vs = [], actions = [], n = {ok:0,monte:0,lourd:0,note:0},
      faits = 0, signalements = 0;
  exos.forEach(function(ex){
    var st = etat(ex), v = verdict(lire(ex.series), st.lignes, uni(ex.charge), st.senti);
    vs.push(v);
    if (!v) return;
    faits++; n[v.niveau]++;
    if (v.action) actions.push("<b>" + v.action + "</b> sur " + ex.nom + ".");
    signalements += v.flags.length;
    v.flags.forEach(function(fl){ actions.push(ex.nom + " — " + fl); });
  });

  var f = document.createElement("div"); f.className = "fiche";
  var etatTxt, etatCls, note;
  if (!faits){
    etatTxt = "Rien de saisi"; etatCls = "vide";
    note = "Reviens en arrière et valide au moins une série.";
  } else if (n.lourd >= 3){
    etatTxt = "Séance trop lourde"; etatCls = "moyen";
    note = "Trois exercices ou plus sont sortis de leur fourchette par le bas. Ce ne sont pas tes jambes ou tes bras qui ont lâché, ce sont les charges de départ qui sont mal calibrées.";
  } else if (n.lourd || signalements){
    etatTxt = "Séance valable"; etatCls = "moyen";
    note = "L'essentiel est bon, il reste des réglages à corriger la prochaine fois.";
  } else {
    etatTxt = "Séance validée"; etatCls = "bien";
    note = faits < exos.length
      ? "Tout ce que tu as fait est dans les clous. " + (exos.length - faits) + " exercice(s) non saisis."
      : "Tout est dans les clous, du premier au dernier exercice.";
  }

  f.innerHTML =
    '<p class="etat ' + etatCls + '">' + etatTxt + "</p>" +
    '<p style="margin:0; font-size:14.5px; color:var(--mute)">' + note + "</p>" +
    '<div class="chiffres">' +
      "<span><b>" + faits + "/" + exos.length + "</b>exercices</span>" +
      "<span><b>" + n.ok + "</b>charge juste</span>" +
      "<span><b>" + n.monte + "</b>à monter</span>" +
      "<span><b>" + n.lourd + "</b>trop lourd</span>" +
    "</div>" +
    (actions.length
      ? '<div class="suite"><h3>Pour la prochaine séance ' + seance + "</h3><ul>" +
        actions.map(function(a){ return "<li>" + a + "</li>"; }).join("") + "</ul></div>"
      : "");

  var bt = document.createElement("button");
  bt.className = "valider"; bt.type = "button"; bt.textContent = "Enregistrer la séance";
  bt.disabled = !faits;
  if (!faits) bt.style.opacity = ".4";
  var msg = document.createElement("p"); msg.className = "msg";
  bt.addEventListener("click", function(){
    var out = {}, k = 0;
    exos.forEach(function(ex){
      var st = etat(ex), lg = st.lignes.filter(function(l){ return l.g !== null; });
      if (!lg.length) return;
      out[ex.nom] = {lignes:lg, senti:st.senti}; k++;
    });
    var iso = isoAuj();
    DB.seances = DB.seances.filter(function(s){ return !(s.date === iso && s.seance === seance); });
    DB.seances.push({date:iso, seance:seance, exos:out});
    DB.seances.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var ok = sauver();
    if (ok) oublierBrouillon();
    msg.className = "msg" + (ok ? "" : " ko");
    msg.textContent = ok ? "Séance enregistrée : " + k + " exercices, " + dateFr(iso) + "."
                         : "Ce navigateur refuse d'enregistrer. Copie tes données à la main.";
    reglages(corps);
  });
  f.appendChild(bt); f.appendChild(msg);
  corps.appendChild(f);
  reglages(corps);
}

function reglages(parent){
  var vieux = document.getElementById("reglages");
  if (vieux) vieux.remove();
  var det = document.createElement("details");
  det.className = "reg"; det.id = "reglages";
  var lignes = DB.seances.slice().reverse().slice(0,10).map(function(s){
    var k = Object.keys(s.exos), ser = 0;
    k.forEach(function(x){ ser += s.exos[x].lignes.length; });
    return "<tr><td>" + dateFr(s.date) + "</td><td><b>" + s.seance + "</b></td>" +
           "<td class='n'>" + k.length + "</td><td class='n'>" + ser + "</td></tr>";
  }).join("");
  det.innerHTML =
    "<summary>Historique et sauvegarde</summary>" +
    '<div class="carte">' +
      (DB.seances.length
        ? "<table><tr><th>Date</th><th>Séance</th><th class='n'>Exos</th><th class='n'>Séries</th></tr>" + lignes + "</table>"
        : "<p>Aucune séance enregistrée pour l'instant.</p>") +
      "<p style='margin-top:13px'>Tes données vivent dans ce navigateur, sur ce téléphone. Copie-les de temps en temps.</p>" +
      '<div class="duo"><button type="button" id="copier">Copier</button>' +
      '<button type="button" id="coller">Restaurer</button></div>' +
      '<p class="msg" id="msgB"></p><textarea id="txt" hidden placeholder="Colle ici ta sauvegarde"></textarea>' +
    "</div>";
  parent.appendChild(det);

  det.querySelector("#copier").addEventListener("click", function(){
    var t = JSON.stringify(DB), m = det.querySelector("#msgB"), z = det.querySelector("#txt");
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(
        function(){ m.textContent = "Copié. Colle-le dans une note."; },
        function(){ z.hidden = false; z.value = t; m.textContent = "Copie ce texte à la main."; });
    else { z.hidden = false; z.value = t; m.textContent = "Copie ce texte à la main."; }
  });
  det.querySelector("#coller").addEventListener("click", function(){
    var z = det.querySelector("#txt"), m = det.querySelector("#msgB");
    if (z.hidden){ z.hidden = false; z.value = ""; z.focus(); m.textContent = "Colle ta sauvegarde puis retouche Restaurer."; return; }
    try {
      var d = JSON.parse(z.value);
      if (!d || !Array.isArray(d.seances)) throw 0;
      DB = d; sauver(); saisie = {}; initSeance(seance); pos = 0;
      m.className = "msg"; m.textContent = "Restauré : " + DB.seances.length + " séances.";
      dessiner();
    } catch(e){
      m.className = "msg ko"; m.textContent = "Texte invalide, rien n'a été modifié.";
    }
  });
}

/* ============ NAVIGATION ============ */
document.getElementById("chronoStop").addEventListener("click", arreterRepos);
document.getElementById("prec").addEventListener("click", function(){
  if (pos > 0){ pos--; sauverBrouillon(); dessiner(); window.scrollTo(0,0); }
});
document.getElementById("suiv").addEventListener("click", function(){
  if (pos < PROG[seance].exos.length){ pos++; sauverBrouillon(); dessiner(); window.scrollTo(0,0); }
});
/* iOS peut suspendre la page sans prevenir : on ecrit avant de partir */
window.addEventListener("pagehide", sauverBrouillon);
window.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden") sauverBrouillon();
});

/* ============ DÉMARRAGE ============ */
var brouillon = lireBrouillon();
if (brouillon && PROG[brouillon.seance]){
  saisie = brouillon.saisie || {};
  seance = brouillon.seance;
  preparer(seance);
  pos = Math.min(brouillon.pos || 0, PROG[seance].exos.length);
  repris = Object.keys(saisie[seance] || {}).some(function(n){
    var st = saisie[seance][n]; return st && st.cour > 0;
  });
  if (brouillon.repos && Date.now() - brouillon.repos.fin < 5 * 60 * 1000){
    repos = brouillon.repos; lancerTic();
  }
} else {
  var j = new Date().getDay(), depart = "A";
  for (var k in PROG) if (PROG[k].jour === j) depart = k;
  initSeance(depart);
}
dessiner();

})();
</script>

<script>
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
